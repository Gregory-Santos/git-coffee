<div class="carrossel">
  <div class="cartao-produto">
    <!-- Informações do produto atual -->
    <div class="informacoes-produto">
      <span class="categoria">{{ produto.categoria }}</span>
      <h2>{{ produto.nome }}</h2>
      <span class="preco">R$ {{ produto.preco}}</span>
      <p>{{ produto.descricao }}</p>
      <button class="botao-adicionar" (click)="adicionar(produto)">
        <span>Adicionar</span>
        <i class="fa-solid fa-cart-shopping"></i>
      </button>
    </div>
    
    <div class="imagem-produto">
      <img [src]="produto.imagem" [alt]="produto.nome">
    </div>

    <button class="seta seta-esquerda" (click)="anterior()" aria-label="Produto anterior">‹</button>
    <button class="seta seta-direita" (click)="proximo()" aria-label="Próximo produto">›</button>
  </div>

  <div class="indicadores">
    @for (item of produtos; track $index) {
      <button [class.ativo]="$index === indiceAtual" (click)="irPara($index)" [attr.aria-label]="'Ir para o produto ' + ($index + 1)"></button>
    }
  </div>
</div>
