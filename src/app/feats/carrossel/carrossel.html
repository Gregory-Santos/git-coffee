<div class="carrossel">
  <div class="cartao-produto">
    <!-- Informações do produto atual -->
    <div class="informacoes-produto">
      <a [routerLink]="['/produtos', produto.id]">
        <h2>{{ produto.nome }}</h2>
        <span class="preco">R$ {{ produto.preco | number:'1.2-2' }}</span>
        <p>{{ limitarDescricao(produto.descricao) }}</p>
      </a>
      <button class="botao-adicionar" (click)="adicionar($any(produto))">
        <span>Adicionar</span>
        <i class="fa-solid fa-cart-shopping"></i>
      </button>
    </div>

    <a [routerLink]="['/produtos', produto.id]">
      <div class="imagem-produto">
        <img [src]="produto.img" [alt]="produto.nome">
      </div>
    </a>

    <button class="seta seta-esquerda" (click)="anterior()" aria-label="Produto anterior">‹</button>
    <button class="seta seta-direita" (click)="proximo()" aria-label="Próximo produto">›</button>
  </div>

  <div class="indicadores">
    @for (item of produtos; track $index) {
    <button [class.ativo]="$index === indiceAtual" (click)="irPara($index)"
      [attr.aria-label]="'Ir para o produto ' + ($index + 1)"></button>
    }
  </div>

  @if (adicionado()) {
  <div class="snackbar">
    Produto adicionado ao carrinho
  </div>
  }
</div>
