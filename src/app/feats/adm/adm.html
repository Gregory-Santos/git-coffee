<div class="container-pai">
  <app-cadastrar
    [produtoParaEditar]="produtoEmEdicao()"
    (produtoCadastrado)="onProdutoCadastrado($event)"
    (produtoAtualizado)="onProdutoAtualizado($event)">
  </app-cadastrar>

  <app-cadastrados
    [produtos]="produtos()"
    (produtoExcluido)="onProdutoExcluido($event)"
    (produtoParaEditar)="onProdutoParaEditar($event)">
  </app-cadastrados>
</div>
