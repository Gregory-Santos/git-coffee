<div class="card-container">

    <div class="card-header">
        <h2>{{ editando ? 'Editar produto' : 'Cadastrar produto' }}</h2>
    </div>

    <form class="card-body" (ngSubmit)="salvar()">
        <div class="form-group">
            <label for="nome">Nome do produto</label>
            <input type="text" id="nome" name="nome" [(ngModel)]="nome">
        </div>

        <div class="form-group">
            <label for="preco">Preço</label>
            <input type="number" step="0.01" id="preco" name="preco" [(ngModel)]="preco">
        </div>

        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="5" [(ngModel)]="descricao"></textarea>
        </div>

        <div class="form-group">
            <label for="urlImagem">URL da imagem</label>
            <input type="text" id="urlImagem" name="urlImagem" [(ngModel)]="urlImagem">
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-cancelar" (click)="cancelar()">Cancelar</button>
            <button type="submit" class="btn btn-cadastrar">{{ editando ? 'Salvar' : 'Cadastrar' }}</button>
        </div>
    </form>
</div>
