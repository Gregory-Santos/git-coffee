


<form class="filtros" (ngSubmit)="filtrarProdutos()">



    <div class="filtro">
        <label for="busca">Buscar Produtos</label>
        <input type="text" id="busca" [(ngModel)]="termoBusca" placeholder="Procurando algo?">
    </div>


<div class="filtro">
    <label for="categoria">Categorias</label>
    <select id="categoria" [(ngModel)]="categoriaSelecionada">
        <option value="">Todas</option>
        <option value="cafe">Cafés</option>
        <option value="capsula">Capsulas e Sachês</option>
        <option value="utensilios">Utensílios</option>
        <option value="souvenir">Souvenirs</option>
    </select>
</div>

<div class="filtro">
    <label for="preco">Preço</label>

<input type="number" id="preco" [(ngModel)]="precoSelecionado" placeholder="R$ 0,00">
</div>

<div class="filtro">
    <label for="organizar">Organizar por</label>
    <select id="organizar" [(ngModel)]="criterioOrganizacao ">
        <option value="">Todas</option>
        <option value="menor-preco">Menor Preço</option>
        <option value="maior-preco">Maior Preço</option>
        <option value="nome">Marca</option>
    </select>
    </div>

    <div class="btn">
        <button type="submit">Filtrar</button>

        <button class="btn-reset"   type="button" (click)="limparFiltros()">Limpar Filtros  </button>
    
</div>

</form>
