<div class="card-container">

<div class="card">
    <div class="imgcard">
        <img [src]="produto().img" [alt]="produto().nome">
    </div>

    <div class="nome">
        <h2>{{ produto().nome }}</h2>
    </div>

    <div class="valor">
        <p>R$ {{produto().preco}}</p>
    </div>
        <button>Adicionar</button> 

</div>
