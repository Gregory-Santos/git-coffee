<div class="card-container">
    <div class="card">
        <div class="imgcard">
            <img [src]="produto().img" [alt]="produto().nome">
        </div>

        <div class="card-info">
            <h2>{{ produto().nome }}</h2>
            <div class="valor">
                <p>R$ {{ produto().preco.toFixed(2) }}</p>
            </div>
        </div>

        <button (click)="adicionarProduto()">Adicionar</button>

        @if (adicionado()) {
            <span>Produto adicionado ao carrinho</span>
        }
    </div>
</div>
