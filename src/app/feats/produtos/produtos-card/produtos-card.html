<div class="card-container">
    <div class="card">
        <a [routerLink]="['/produtos', produto().id]">
        <div class="imgcard">
            <img [src]="produto().img" [alt]="produto().nome">
        </div>

        <div class="card-info">
            <h2>{{ produto().nome }}</h2>
            <div class="valor">
                <p>R$ {{ produto().preco.toFixed(2) }}</p>
            </div>
        </div>
        </a>

        <button (click)="adicionarProduto()">Adicionar</button>

        @if (adicionado()) {
  <div class="snackbar">
    Produto adicionado ao carrinho
  </div>
}
    </div>
</div>
